name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            python3 python3-pil grub-common fonts-dejavu-core xz-utils shellcheck >/dev/null
      - name: build
        run: tools/build-release.sh
      - name: shellcheck
        run: shellcheck -S warning -x nirusplash tools/*.sh tests/*.sh
      - name: unit
        run: tests/unit.sh
